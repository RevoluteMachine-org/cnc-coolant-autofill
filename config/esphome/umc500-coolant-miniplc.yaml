# UMC 500 coolant MiniPLC — the ESPHome config running on our controller,
# published as an example. See config/esphome/README.md before using it.
#
# Not included here: Wi-Fi, API encryption and OTA passwords. Our controller
# is on wired Ethernet. If you copy this, add an API encryption key and an
# OTA password from your own secrets.yaml, e.g.
#   api:
#     encryption:
#       key: !secret api_encryption_key
#   ota:
#     - platform: esphome
#       password: !secret ota_password

esphome:
  name: umc500-coolant-miniplc
  friendly_name: UMC 500 Coolant MiniPLC
  comment: UMC 500 coolant management — HomeMaster MiniPLC
  min_version: 2025.7.0
  name_add_mac_suffix: false
  project:
    name: homemaster.miniplc
    version: 1.0.0
  # >>> ADDED 2026-10-16 — fail-closed on controller restart.
  # Whatever the valves were doing before a reboot, start with both closed.
  # (Interrupts a fill in progress if the MiniPLC restarts — deliberate:
  # fail toward closed. The fill script's timeout/notification covers it.)
  on_boot:
    priority: -100
    then:
      - switch.turn_off: wld_1_relay1_coil
      - switch.turn_off: wld_1_relay2_coil
  # <<< END ADDED

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    version: recommended

logger:
  baud_rate: 115200

api:

web_server:
  port: 80
  version: 3
  ota: false

http_request:
  id: http_request_data

ota:
- platform: esphome
  id: ota_esphome
- platform: http_request
  id: ota_http_request

update:
- platform: http_request
  id: firmware_update
  name: Firmware Update
  source: 
    https://isystemsautomation.github.io/homemaster-dev/MiniPLC/Firmware/manifest.json
  update_interval: 6h

