# ============================================================================
# Filter pressure transmitters — MiniPLC analog inputs AI1–AI4 (2026-10-13)
# ============================================================================
# 4 × ProSense SPTD25-20-0100H (0–100 psig, 4–20 mA, 2-wire), each through a
# 499 Ω shunt into a MiniPLC 0–10 V analog input.
#
#   Enclosure label   MiniPLC   Signal
#   AI 0.1            AI1       Flood filter upstream      (F1 UP)
#   AI 0.2            AI2       Flood filter downstream    (F1 DN)
#   AI 0.3            AI3       Conveyor filter upstream   (F2 UP)
#   AI 0.4            AI4       Conveyor filter downstream (F2 DN)
#
# Calibration — measured 2026-09-24, all four on one air manifold
# (see docs/build-notes.md):
#   zero (4 mA) volts:  AI1 1.986  AI2 1.996  AI3 1.993  AI4 2.005
#   span: 100 psi = 7.984 V above zero (16 mA × 499 Ω)
# Below ~3 mA (1.5 V) the loop is broken: report NaN, not a false low.
# Gated averages use an INTERIM 5 psi "pump running" gate — tune later.
# ============================================================================
# --- Raw analog inputs (volts at the terminal) — diagnostics -------------
- platform: ads1115
  id: ai_1
  ads1115_id: ads1115_hub
  multiplexer: A3_GND
  gain: 6.144
  name: AI 1
  update_interval: 5s
  entity_category: diagnostic
  filters:
    - multiply: 3
- platform: ads1115
  id: ai_2
  ads1115_id: ads1115_hub
  multiplexer: A2_GND
  gain: 6.144
  name: AI 2
  update_interval: 5s
  entity_category: diagnostic
  filters:
    - multiply: 3
- platform: ads1115
  id: ai_3
  ads1115_id: ads1115_hub
  multiplexer: A1_GND
  gain: 6.144
  name: AI 3
  update_interval: 5s
  entity_category: diagnostic
  filters:
    - multiply: 3
- platform: ads1115
  id: ai_4
  ads1115_id: ads1115_hub
  multiplexer: A0_GND
  gain: 6.144
  name: AI 4
  update_interval: 5s
  entity_category: diagnostic
  filters:
    - multiply: 3

# --- Pressures in psi ----------------------------------------------------
- platform: template
  name: "Flood filter upstream pressure"
  id: flood_up_psi
  unit_of_measurement: "psi"
  device_class: pressure
  state_class: measurement
  accuracy_decimals: 1
  update_interval: 5s
  lambda: |-
    const float v = id(ai_1).state;
    if (isnan(v) || v < 1.5) return NAN;          // loop broken
    return (v - 1.986) / 7.984 * 100.0;           // AI1 zero 1.986 V

- platform: template
  name: "Flood filter downstream pressure"
  id: flood_dn_psi
  unit_of_measurement: "psi"
  device_class: pressure
  state_class: measurement
  accuracy_decimals: 1
  update_interval: 5s
  lambda: |-
    const float v = id(ai_2).state;
    if (isnan(v) || v < 1.5) return NAN;
    return (v - 1.996) / 7.984 * 100.0;           // AI2 zero 1.996 V

- platform: template
  name: "Conveyor filter upstream pressure"
  id: conveyor_up_psi
  unit_of_measurement: "psi"
  device_class: pressure
  state_class: measurement
  accuracy_decimals: 1
  update_interval: 5s
  lambda: |-
    const float v = id(ai_3).state;
    if (isnan(v) || v < 1.5) return NAN;
    return (v - 1.993) / 7.984 * 100.0;           // AI3 zero 1.993 V

- platform: template
  name: "Conveyor filter downstream pressure"
  id: conveyor_dn_psi
  unit_of_measurement: "psi"
  device_class: pressure
  state_class: measurement
  accuracy_decimals: 1
  update_interval: 5s
  lambda: |-
    const float v = id(ai_4).state;
    if (isnan(v) || v < 1.5) return NAN;
    return (v - 2.005) / 7.984 * 100.0;           // AI4 zero 2.005 V

# --- Instantaneous ΔP ----------------------------------------------------
- platform: template
  name: "Flood filter ΔP"
  id: flood_dp
  unit_of_measurement: "psi"
  device_class: pressure
  state_class: measurement
  accuracy_decimals: 1
  update_interval: 5s
  lambda: |-
    return id(flood_up_psi).state - id(flood_dn_psi).state;   // NaN propagates

- platform: template
  name: "Conveyor filter ΔP"
  id: conveyor_dp
  unit_of_measurement: "psi"
  device_class: pressure
  state_class: measurement
  accuracy_decimals: 1
  update_interval: 5s
  lambda: |-
    return id(conveyor_up_psi).state - id(conveyor_dn_psi).state;

# --- Gated ΔP averages (only while that filter's pump is running) --------
# Same pattern as the retired dual-pressure-differential-1 device:
# a 9999 sentinel when gated off, filtered out before a 24-sample
# (2-minute) moving average. These are what the dashboards should show.
- platform: template
  name: "Flood filter ΔP (running avg)"
  id: flood_dp_avg
  unit_of_measurement: "psi"
  device_class: pressure
  state_class: measurement
  accuracy_decimals: 1
  update_interval: 5s
  lambda: |-
    const float up = id(flood_up_psi).state;
    if (isnan(up) || up <= 5.0) return 9999.0;   // pump off: interim 5 psi gate
    return id(flood_dp).state;
  filters:
    - filter_out: 9999.0
    - filter_out: nan
    - sliding_window_moving_average:
        window_size: 24
        send_every: 1

- platform: template
  name: "Conveyor filter ΔP (running avg)"
  id: conveyor_dp_avg
  unit_of_measurement: "psi"
  device_class: pressure
  state_class: measurement
  accuracy_decimals: 1
  update_interval: 5s
  lambda: |-
    const float up = id(conveyor_up_psi).state;
    if (isnan(up) || up <= 5.0) return 9999.0;   // pump off: interim 5 psi gate
    return id(conveyor_dp).state;
  filters:
    - filter_out: 9999.0
    - filter_out: nan
    - sliding_window_moving_average:
        window_size: 24
        send_every: 1
