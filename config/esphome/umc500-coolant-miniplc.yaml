    github://isystemsautomation/homemaster-dev/MiniPLC/Firmware/miniplc.yaml@main
  import_full_config: true

# Optional wired Ethernet (LAN8720 PHY)
# NOTE: clk_mode is deprecated as of ESPHome 2026.1 — touch this on upgrade.
ethernet:
  type: LAN8720
  id: eth_phy
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk_mode: GPIO0_OUT
  phy_addr: 1

# RS-485 / Modbus RTU bus.
uart:
  id: uart_modbus
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 19200

# Modbus RTU master over the RS-485 UART above.
# The HomeMaster packages hardcode `modbus_id: modbus_bus` — keep this id,
# and do not declare a second modbus_controller for any packaged module.
#
# UPGRADE COUPLING: turnaround_time / send_wait_time do NOT exist on the
# installed ESPHome 2025.12.5 (invalid-option error). They were introduced in
# 2026.7.0, which also raised the defaults to 600ms / 2000ms. When ESPHome is
# upgraded past 2026.7.0, add both options here IN THE SAME CHANGE, set to the
# old defaults, or the bus silently slows and can starve modules.
modbus:
  id: modbus_bus
  uart_id: uart_modbus

# HomeMaster expansion modules on the RS-485 bus.
#
# Each package path MUST match the firmware version actually on that module.
# v0.1.0 and v0.2.0 register maps are not drop-in compatible.
#
#   AIO-422-R1  = 3  firmware v0.2.0 (flashed 2026-10-06)  -> v0.2.0 package
#   WLD-521-R1  = 4  firmware v0.1.0 (no v0.2.0 UF2 published) -> v0.1.0 package
#
# Addresses read from each module's WebConfig — the READMEs' stated defaults
# have been wrong twice, so always read the module rather than trust docs.
# The ENM-223-R1 (formerly address 4) is removed from this panel.
packages:
  wld_1:
    url: https://github.com/isystemsautomation/homemaster-dev
    ref: main
    files:
    - path: WLD-521-R1/Firmware/v0.1.0/default_wld_521_r1_plc/default_wld_521_r1_plc.yaml
      vars:
        wld_id: wld_1
        wld_address: "4"
        wld_prefix: "WLD #1"
  aio_1:
    url: https://github.com/isystemsautomation/homemaster-dev
    ref: main
    files:
    - path: AIO-422-R1/Firmware/v0.2.0/default_aio_422_r1_plc/default_aio_422_r1_plc.yaml
      vars:
        aio_id: aio_1
        aio_address: "3"
        aio_prefix: "AIO #1"

# >>> ADDED 2026-10-16 — VALVE WATCHDOG (runs on the MiniPLC; works with HA down)
# ============================================================================
# If a WLD valve relay is reported ON longer than its limit, force it OFF and
# keep forcing it every 5 s until the WLD reports it off. Limits sit well above
# a normal fill (~3 min water) but far below "flood the tank":
#   Relay 2 (water valve)       — 6 min  (~8 gal at 4.8 L/min worst case)
#   Relay 1 (concentrate valve) — 3 min
# Uses the WLD's REPORTED relay state (wld_1_rlyN_state, read over Modbus) so
# it reacts to what the relay is actually doing. IDs come from the pinned
# WLD-521-R1 v0.1.0 package. Limitation: if Modbus to the WLD is lost, the
# state goes stale and the OFF write cannot land (the WLD has no comm-loss
# failsafe — see docs/safety.md). millis() wrap (~49 days) is safe: unsigned math.
# ============================================================================
globals:
  - id: wd_relay1_on_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: wd_relay2_on_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

interval:
  - interval: 5s
    then:
      - lambda: |-
          const uint32_t now = millis();
          const uint32_t LIMIT_WATER_MS = 6UL * 60UL * 1000UL;   // relay 2
          const uint32_t LIMIT_CONC_MS  = 3UL * 60UL * 1000UL;   // relay 1

          // --- Relay 2: water valve ---
          if (id(wld_1_rly2_state).state) {
            if (id(wd_relay2_on_ms) == 0) {
              id(wd_relay2_on_ms) = now == 0 ? 1 : now;
            } else if ((now - id(wd_relay2_on_ms)) > LIMIT_WATER_MS) {
              ESP_LOGW("valve_wd", "Relay 2 (water) ON > 6 min - forcing OFF");
              id(wld_1_relay2_coil).turn_off();
              id(valve_wd_tripped).publish_state(true);
            }
          } else {
            id(wd_relay2_on_ms) = 0;
          }

          // --- Relay 1: concentrate valve ---
          if (id(wld_1_rly1_state).state) {
            if (id(wd_relay1_on_ms) == 0) {
              id(wd_relay1_on_ms) = now == 0 ? 1 : now;
            } else if ((now - id(wd_relay1_on_ms)) > LIMIT_CONC_MS) {
              ESP_LOGW("valve_wd", "Relay 1 (concentrate) ON > 3 min - forcing OFF");
              id(wld_1_relay1_coil).turn_off();
              id(valve_wd_tripped).publish_state(true);
            }
          } else {
            id(wd_relay1_on_ms) = 0;
          }

# Lets Home Assistant clear the watchdog flag after investigating.
button:
  - platform: template
    id: valve_wd_reset
    name: "Valve watchdog reset"
    entity_category: config
    on_press:
      - lambda: id(valve_wd_tripped).publish_state(false);
# <<< END ADDED

